name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          fail: true
          # Skip unpublished documentation/projects and pages with unrendered Liquid links.
          # Projects are not enabled in _config.yml; the folder contains unused theme examples.
          # The post-deployment workflow checks local links in the rendered HTML.
          args: >-
            --user-agent 'curl/7.54'
            --max-retries 3 --retry-wait-time 5
            --exclude-path README.md
            --exclude-path CONTRIBUTING.md
            --exclude-path CUSTOMIZE.md
            --exclude-path FAQ.md
            --exclude-path INSTALL.md
            --exclude-path _projects
            --exclude-path _pages/404.md
            --exclude-path _pages/blog.md
            --exclude-path _pages/working_papers.md
            --exclude-path _posts/2018-12-22-distill.md
            --exclude-path _posts/2023-04-24-videos.md
            --exclude-path _books/the_godfather.md
            --verbose --no-progress './**/*.md' './**/*.html'
